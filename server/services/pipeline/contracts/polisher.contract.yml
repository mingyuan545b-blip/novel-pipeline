# polisher节点契约定义
# 润色：文采提升，必须拿到深度字段避免润色时抹平角色深度
agent: polisher
format: simple

# 输入素材契约
input:
  required:
    - path: chapter.content
      type: string
      minLength: 100
      severity: CRITICAL
      errorCode: PO-IN-001
      message: 章节正文必须存在且≥100字

    - path: project
      type: object
      severity: HIGH
      errorCode: PO-IN-002
      message: 项目信息必须存在

  # 润色素材深度字段校验（simple格式，但需知道深度字段避免抹平）
  materialFields:
    character:
      requireMinCount:
        min: 1
        severity: CRITICAL
        errorCode: PO-IN-004
        message: CH2+润色无未归档角色素材，无法保留角色深度
        exceptFirstChapter: true

      stateJson:
        anyOf:
          - innerConflict
          - independentStance
          - fateArc
        severity: CRITICAL
        errorCode: PO-IN-003
        message: 润色缺少角色深度字段，润色时可能抹平角色深度（陷阱#79断链）
        exceptFirstChapter: true

# 输出契约
output:
  required:
    - field: response
      type: string
      minLength: 100
      severity: CRITICAL
      errorCode: PO-OUT-001
      message: polisher输出response必须存在且≥100字（润色后正文）
