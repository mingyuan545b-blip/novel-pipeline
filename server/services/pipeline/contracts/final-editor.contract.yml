# final-editor节点契约定义
# 终审：定稿+字数校验，必须拿到深度字段+一审结果
agent: final-editor
format: simple

# 输入素材契约
input:
  required:
    - path: chapter.content
      type: string
      minLength: 100
      severity: CRITICAL
      errorCode: FE-IN-001
      message: 章节正文必须存在且≥100字

    - path: chapter.firstReviewOutput
      type: string
      minLength: 10
      severity: HIGH
      errorCode: FE-IN-002
      message: 终审依赖一审结果（firstReviewOutput）

    - path: project
      type: object
      severity: HIGH
      errorCode: FE-IN-003
      message: 项目信息必须存在

  # 终审素材深度字段校验（simple格式，但定稿时需确认深度字段已体现）
  materialFields:
    character:
      requireMinCount:
        min: 1
        severity: CRITICAL
        errorCode: FE-IN-005
        message: CH2+终审无未归档角色素材，无法定稿
        exceptFirstChapter: true

      stateJson:
        anyOf:
          - innerConflict
          - independentStance
          - fateArc
        severity: CRITICAL
        errorCode: FE-IN-004
        message: 终审缺少角色深度字段，定稿后可能工具人化（陷阱#79断链）
        exceptFirstChapter: true

# 输出契约
output:
  required:
    - field: response
      type: string
      minLength: 100
      severity: CRITICAL
      errorCode: FE-OUT-001
      message: final-editor输出response必须存在且≥100字（定稿正文）
