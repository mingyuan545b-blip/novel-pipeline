name: CI

on:
  push:
    branches: [main, master, dev, 'milestone/**']
  pull_request:
    branches: [main, master, 'milestone/**']

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.x }
      - run: npm install
      - run: npx eslint server --max-warnings=0

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.x }
      - run: npm install
      - run: npx jest tests/unit --coverage --ci
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/

  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.x }
      - run: npm install
      - name: Integration tests
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js tests/integration --testTimeout=120000

  backend-e2e-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.x }
      - run: npm install
      - name: E2E material injection tests
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js tests/e2e/e2eMaterialInjection.test.js --testTimeout=60000

  frontend-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.x }
      - run: npm install
      - run: npx eslint src --ignore-pattern "__tests__" --max-warnings=0

  frontend-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.x }
      - run: npm install
      - run: npx vitest run --coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: client/coverage/

  line-count-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Check line limit (rule source: scripts/lib/ironLawRules.js)'
        run: node scripts/verifyLineCount.js

  gates:
    # 自研门禁全链（30 道 verify/audit：可达性、模块开关、fail-open 基线、API 契约、
    # 字段 Schema、数据源一致性、深审、泄漏修复、性能基线…）。
    # 说明：CI 无 .env/PG，属"环境相关"的检查会显式 SKIP 或 WARN（不伪装通过）；
    #       需要真实库的存量体检在本地 pre-commit / 手工 ci:check 中执行。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.x }
      - run: npm install
      - name: 'Custom gates (ci:check)'
        run: npm run ci:check

  doc-freshness-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.x }
      - run: npm install
      - run: node scripts/verifyDocFreshness.js

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 24.x }
      - run: npm ci
      - name: Dependency audit (root, production, high)
        run: npm audit --audit-level=high --omit=dev
      - name: Dependency audit (server, production, high)
        working-directory: server
        run: npm audit --audit-level=high --omit=dev
      - name: Dependency audit (client, production, high)
        working-directory: client
        run: npm audit --audit-level=high --omit=dev
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.x }
      - run: npm install
      - name: Module load smoke test
        run: node tests/e2e/e2eSmokeTest.js
